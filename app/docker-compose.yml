services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: aegisflow
      POSTGRES_USER: aegisflow
      POSTGRES_PASSWORD: aegisflow-secret
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegisflow -d aegisflow"]
      interval: 5s
      timeout: 3s
      retries: 20

  temporal:
    image: temporalio/server:1.28.1
    command: server start-dev --ip 0.0.0.0 --ui-ip 0.0.0.0
    ports:
      - "7233:7233"
      - "8233:8233"

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: aegisflow
      MINIO_ROOT_PASSWORD: aegisflow-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  minio-data:
