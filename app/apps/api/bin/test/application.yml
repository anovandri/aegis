spring:
  datasource:
    url: jdbc:h2:mem:aegisflow-${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
  flyway:
    locations: classpath:db/migration

aegisflow:
  storage:
    provider: in-memory
    bucket: aegisflow-documents
  temporal:
    enabled: false
  llm:
    provider: local
  knowledge:
    embedding:
      provider: local
